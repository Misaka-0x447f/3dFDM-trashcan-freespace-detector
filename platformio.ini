; 3D printer waste-bin free-space detector
; Hardware: ESP8266 NodeMCU + HX711 (DT=D1, SCK=D2) + WS2812B-8 (D7) + SSD1306 OLED (D5/D6)

[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266 @ ~4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    olikraus/U8g2 @ ^2.35.30
build_flags =
    -Wall
    ; 默认按标准 NodeMCU 丝印：D5=GPIO14=SCL, D6=GPIO12=SDA
    ; 若实测点不亮，把下一行注释掉，启用 I2C_PINMAP_SWAPPED
    ; -DI2C_PINMAP_STANDARD
    -DI2C_PINMAP_SWAPPED

; ---- 主固件 ----
[env:nodemcuv2]
build_src_filter = +<*> -<i2c_scan.cpp>

; ---- 一次性探针：先烧这个，串口 115200 看地址，确认 I2C 引脚映射后切回 nodemcuv2 ----
[env:i2c_scan]
build_src_filter = -<*> +<i2c_scan.cpp>
